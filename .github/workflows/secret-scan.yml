name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Gitleaks (fichiers suivis uniquement)"
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          # Analyse de l'arbre courant : l'historique contient d'anciens secrets déjà connus, à révoquer.
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
